name: Birthday-email

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run script
        run: python ./main.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Updated code
          commit_user_name: Antoni Luna [Github Actions]
          commit_user_email: primefire0.3@gmail.com
          commit_author: Ant0niDev
